<body scroll="no" style="overflow: hidden" bottom="50">

    <div id="main">
        <div id="wrap">
            <div id="text">
                <div id="code" style="font-family: 'Roboto', sans-serif; line-height: 3.1; color: #333; text-align: center;">
                    <div style="margin-bottom: 18px;">
                        <span class="say" style="font-size: 1.22rem; background: linear-gradient(to right, #FF69B4, #8A2BE2); -webkit-background-clip: text; color: transparent; font-weight: bold;">Này <span id="user-name"></span> ơi!!!</span>
                    </div>
                    <ul style="list-style: none; padding-left: 0; margin: 0; text-align: left; line-height: 2.5;">
                      <li style="margin-bottom: 12px; display: flex; align-items: center;">
                        <span class="say" style="font-size: 1.2rem; background: linear-gradient(to right, #FF69B4, #8A2BE2); -webkit-background-clip: text; color: transparent; font-weight: 500;">Cậu có biết khum?</span>
                      </li>
                      <li style="margin-bottom: 12px; display: flex; align-items: center;">
                        <span class="say" style="font-size: 1.2rem; background: linear-gradient(to right, #FF69B4, #8A2BE2); -webkit-background-clip: text; color: transparent; font-weight: 500;">PRX vô địch VCT Pacific. Thằng nào không biết là thằng ngu!!!</span>
                      </li>
                      <li style="margin-bottom: 0; display: flex; align-items: center;">
                        <span class="say" style="color: #FF6347; font-size: 1.25rem; font-weight: bold;">My team, my love.</span>
                        <span style="font-size: 1.5rem; color: initial; margin-left: 10px;">❤️</span>
                      </li>
                    </ul>
                </div>
            </div>
            <div id="clock-box">
                <span class="STYLE1"></span>
                <font style="color: #FF69B4;font-size: 25px;">Fan PRX 20 năm✨</font>
                <div id="clock"></div>
            </div>
            <canvas id="canvas" width="1100" height="680"></canvas>
        </div>
        <div class="image-container left" style="display:none;">
            <div class="image-frame">
                <img src="img/anh1.jpg" alt="Ảnh trái 1">
            </div>
            <div class="image-frame">
                <img src="img/anh2.jpg" alt="Ảnh trái 2">
            </div>
            <div class="image-frame">
                <img src="img/anh3.jpg" alt="Ảnh trái 3">
            </div>
            <div class="image-frame">
                <img src="img/anh4.jpg" alt="Ảnh trái 4">
            </div>
        </div>
        <div class="image-container right" style="display:none;">
            <div class="image-frame">
                <img src="img/anh5.jpg" alt="Ảnh phải 1">
            </div>
            <div class="image-frame">
                <img src="img/anh6.jpg" alt="Ảnh phải 2">
            </div>
            <div class="image-frame">
                <img src="img/anh7.jpg" alt="Ảnh phải 3">
            </div>
            <div class="image-frame">
                <img src="img/anh8.jpg" alt="Ảnh phải 4">
            </div>
        </div>
    </div>
    

    <script>
    </script>

    <script>
        var year = getUrlParameter('year') ? parseInt(getUrlParameter('year')) : 2003;
        var month = getUrlParameter('month') ? parseInt(getUrlParameter('month')) - 1 : 5; // 7 là tháng 8
        var day = getUrlParameter('day') ? parseInt(getUrlParameter('day')) : 20;
        console.log("Year:", year);
        console.log("Month:", month);
        console.log("Day:", day);

        (function () {
            var canvas = $('#canvas');

            if (!canvas[0].getContext) {
                $("#error").show();
                return false;
            }

            var width = canvas.width();
            var height = canvas.height();
            canvas.attr("width", width);
            canvas.attr("height", height);
            var opts = {
                seed: {
                    x: width / 2 - 20,
                    color: "rgb(190, 26, 37)",
                    scale: 2
                },
                branch: [
                    [535, 680, 570, 250, 500, 200, 30, 100, [
                        [540, 500, 455, 417, 340, 400, 13, 100, [
                            [450, 435, 434, 430, 394, 395, 2, 40]
                        ]],
                        [550, 445, 600, 356, 680, 345, 12, 100, [
                            [578, 400, 648, 409, 661, 426, 3, 80]
                        ]],
                        [539, 281, 537, 248, 534, 217, 3, 40],
                        [546, 397, 413, 247, 328, 244, 9, 80, [
                            [427, 286, 383, 253, 371, 205, 2, 40],
                            [498, 345, 435, 315, 395, 330, 4, 60]
                        ]],
                        [546, 357, 608, 252, 678, 221, 6, 100, [
                            [590, 293, 646, 277, 648, 271, 2, 80]
                        ]]
                    ]]
                ],
                bloom: {
                    num: 600,
                    width: 1080,
                    height: 650,
                },
                footer: {
                    width: 1200,
                    height: 5,
                    speed: 10,
                }
            }

            var tree = new Tree(canvas[0], width, height, opts);
            var seed = tree.seed;
            var foot = tree.footer;
            var hold = 1;

            canvas.click(function (e) {
                var offset = canvas.offset(), x, y;
                x = e.pageX - offset.left;
                y = e.pageY - offset.top;
                if (seed.hover(x, y)) {
                    hold = 0;
                    canvas.unbind("click");
                    canvas.unbind("mousemove");
                    canvas.removeClass('hand');
                }
            }).mousemove(function (e) {
                var offset = canvas.offset(), x, y;
                x = e.pageX - offset.left;
                y = e.pageY - offset.top;
                canvas.toggleClass('hand', seed.hover(x, y));
            });

            var seedAnimate = eval(Jscex.compile("async", function () {
                seed.draw();
                while (hold) {
                    $await(Jscex.Async.sleep(10));
                }
                while (seed.canScale()) {
                    seed.scale(0.95);
                    $await(Jscex.Async.sleep(10));
                }
                while (seed.canMove()) {
                    seed.move(0, 2);
                    foot.draw();
                    $await(Jscex.Async.sleep(10));
                }
            }));

            var growAnimate = eval(Jscex.compile("async", function () {
                do {
                    tree.grow();
                    $await(Jscex.Async.sleep(10));
                } while (tree.canGrow());
            }));

            var flowAnimate = eval(Jscex.compile("async", function () {
                do {
                    tree.flower(2);
                    $await(Jscex.Async.sleep(10));
                } while (tree.canFlower());
            }));

            var moveAnimate = eval(Jscex.compile("async", function () {
                tree.snapshot("p1", 240, 0, 610, 680);
                while (tree.move("p1", 500, 0)) {
                    foot.draw();
                    $await(Jscex.Async.sleep(10));
                }
                foot.draw();
                tree.snapshot("p2", 500, 0, 610, 680);

                canvas.parent().css("background", "url(" + tree.toDataURL('image/png') + ")");
                canvas.css("background", "none");
                $await(Jscex.Async.sleep(300));
                canvas.css("background", "none");
            }));

            var jumpAnimate = eval(Jscex.compile("async", function () {
                var ctx = tree.ctx;
                while (true) {
                    tree.ctx.clearRect(0, 0, width, height);
                    tree.jump();
                    foot.draw();
                    $await(Jscex.Async.sleep(25));
                }
            }));

            var textAnimate = eval(Jscex.compile("async", function () {
                $("#code").css({
                    "background": "linear-gradient(135deg, rgba(255, 250, 205, 0.9), rgba(255, 236, 179, 0.8))",
                    "box-shadow": "0 8px 25px rgba(255, 215, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.1)",
                    "border-radius": "20px",
                    "width": "450px",
                    "height": "380px",
                    "left": "0px",
                    "top": "0px",
                    "position": "absolute",
                    "border": "3px solid rgba(255, 255, 255, 0.4)",
                    "backdrop-filter": "blur(8px)",
                    "padding": "20px",
                    "font-family": "'Noto Sans Vietnamese', cursive",
                    "position": "relative"
                });
                
                // Thêm hiệu ứng đóng dấu
                $("#code").append('<div style="position: absolute; top: 10px; left: 10px; width: 40px; height: 40px; border: 2px solid rgba(255, 105, 180, 0.6); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; color: rgba(255, 105, 180, 0.8); font-weight: bold;">❤️</div>');
            
                var together = new Date();
                together.setFullYear(year, month, day);
                together.setHours(0);
                together.setMinutes(0);
                together.setSeconds(0);
                together.setMilliseconds(0);
            
                console.log("test");
                $("#code").show().typewriter();
                $("#clock-box").fadeIn(500);
                while (true) {
                    timeElapse(together);
                    $await(Jscex.Async.sleep(1000));
                }
            }));
            function timeElapse(date) {
                var now = new Date();
                // Lấy mốc bắt đầu từ biến year, month, day
                var start = new Date(year, month, day, 0, 0, 0, 0);
                var diff = now.getTime() - start.getTime();
                if (diff < 0) diff = 0;
                var seconds = Math.floor(diff / 1000);
                var days = Math.floor(seconds / (3600 * 24));
                seconds = seconds % (3600 * 24);
                var hours = Math.floor(seconds / 3600);
                if (hours < 10) hours = "0" + hours;
                seconds = seconds % 3600;
                var minutes = Math.floor(seconds / 60);
                if (minutes < 10) minutes = "0" + minutes;
                seconds = seconds % 60;
                if (seconds < 10) seconds = "0" + seconds;
                var result = "<span class=\"digit\">" + days + "</span> ngày <span class=\"digit\">" + hours + "</span> giờ <span class=\"digit\">" + minutes + "</span> phút <span class=\"digit\">" + seconds + "</span> giây";
                $("#clock").html(result);
            }
            function showImageFrames() {
                document.querySelectorAll('.image-container').forEach(function(el) {
                    el.style.display = 'flex';
                    el.style.flexDirection = 'column';
                    el.style.height = '80vh';
                    el.style.justifyContent = 'space-between';
                    el.style.padding = '5vh 0';
                    el.querySelectorAll('.image-frame').forEach(function(frame) {
                        frame.style.animation = 'none';
                        void frame.offsetWidth;
                        frame.style.animation = '';
                    });
                });
            }
            var runAsync = eval(Jscex.compile("async", function () {
                $await(seedAnimate());
                $await(growAnimate());
                $await(flowAnimate());
                $await(moveAnimate());
                document.querySelectorAll('.image-container').forEach(function(el) {
                    el.style.display = 'flex';
                });
                textAnimate().start();
                $await(jumpAnimate());
            }));

            runAsync().start();
        })();
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            var results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }
        
        var userName = getUrlParameter('name') || 'cậu';
        
        document.addEventListener("DOMContentLoaded", function() {
            console.log("User Name:", userName); 
            document.getElementById('user-name').textContent = userName;
        });

        document.addEventListener("DOMContentLoaded", function() {
            // Đợi một chút để đảm bảo các container ảnh đã được hiển thị
            setTimeout(function() {
                startImageRotation();
            }, 3000);
        });

        // Thêm hiệu ứng thay đổi ảnh tự động
        function startImageRotation() {
            // Lấy tất cả các khung ảnh
            const leftFrames = document.querySelectorAll('.image-container.left .image-frame img');
            const rightFrames = document.querySelectorAll('.image-container.right .image-frame img');
            
            // Ghép cặp ảnh cho từng khung
            const imagePairs = [
                // Cặp ảnh cho 4 khung bên trái
                ['img/anh1.jpg', 'img/anh8.jpg'],
                ['img/anh2.jpg', 'img/anh7.jpg'],
                ['img/anh3.jpg', 'img/anh6.jpg'],
                ['img/anh4.jpg', 'img/anh5.jpg'],
                // Cặp ảnh cho 4 khung bên phải
                ['img/anh1.jpg', 'img/anh8.jpg'],
                ['img/anh2.jpg', 'img/anh7.jpg'],
                ['img/anh3.jpg', 'img/anh6.jpg'],
                ['img/anh4.jpg', 'img/anh5.jpg']
            ];

            const allFrames = [...leftFrames, ...rightFrames];

            // Gán trạng thái ban đầu và theo dõi ảnh hiện tại cho mỗi khung
            allFrames.forEach((frame) => {
                // Đặt thuộc tính để theo dõi cặp ảnh đang hiển thị. 0 là ảnh đầu, 1 là ảnh thứ hai.
                frame.dataset.currentImageInPair = 0;
            });

            setInterval(() => {
                allFrames.forEach((frame, index) => {
                    frame.classList.add('fade-out');
                    
                    setTimeout(() => {
                        // Lấy chỉ số của ảnh hiện tại trong cặp (0 hoặc 1)
                        let currentImageIndex = parseInt(frame.dataset.currentImageInPair);
                        
                        // Đảo ngược chỉ số để lấy ảnh còn lại (0 -> 1, 1 -> 0)
                        const nextImageIndex = 1 - currentImageIndex;
                        
                        // Cập nhật nguồn ảnh và trạng thái
                        frame.src = imagePairs[index][nextImageIndex];
                        frame.dataset.currentImageInPair = nextImageIndex;
                        
                        // Đợi ảnh mới tải xong rồi mới hiện ra
                        frame.onload = () => {
                            frame.classList.remove('fade-out');
                        };
                    }, 200);
                });
            }, 3000); // Tần suất thay đổi ảnh
        }
    </script>
    <div style="text-align:center;margin:0px 0; font:normal 14px/24px 'MicroSoft YaHei';">
    </div>


</body>
